repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: name-tests-test
      - id: requirements-txt-fixer

  - repo: https://github.com/golangci/golangci-lint
    rev: e8f621973e2dfce68b7839ff16affa09cb103239 # v2.11.2
    hooks:
      - id: golangci-lint

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'go vet ./...'
        pass_filenames: false
        types: [go]
      - id: go-fmt
        name: go fmt
        language: system
        entry: bash -c 'go fmt ./...'
        pass_filenames: false
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: bash -c 'go mod tidy'
        pass_filenames: false
        types: [go]
      - id: go-test-mod
        name: go test mod
        language: system
        entry: bash -c 'go test ./...'
        pass_filenames: false
        types: [go]
      - id: go-sec
        name: go security check
        language: system
        entry: bash -c 'go install github.com/securego/gosec/v2/cmd/gosec && gosec ./...'
        pass_filenames: false
        types: [go]
